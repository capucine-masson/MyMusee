<!doctype html>
<html lang="{{ boot.prefs.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Musée IA</title>
  <meta name="description" content="Envoie la photo d'un tableau : analyse, œuvres proches et explications sourcées.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#231F20">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23231F20'/%3E%3Crect x='6' y='7' width='20' height='18' fill='%23F3DFA2'/%3E%3Crect x='9' y='10' width='14' height='12' fill='%23231F20'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23BB4430'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Architects+Daughter&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="page-{{ page }}">
  <div class="sky" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="/" aria-label="Musée IA">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="6" y="7" width="20" height="18" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="3.2" fill="currentColor"/></svg>
      <span class="brand-name">Musée IA</span>
    </a>
    <nav class="nav" aria-label="Navigation">
      <a href="/" data-i18n="nav.home" {% if page == 'index' %}aria-current="page"{% endif %}>Accueil</a>
      <a href="/salle" data-i18n="nav.salle" {% if page == 'salle' %}aria-current="page"{% endif %}>La salle</a>
    </nav>
    <div class="lang" role="group" aria-label="Langue / Language">
      <button type="button" class="flag" data-lang="fr" aria-pressed="false" aria-label="Français" title="Français">
        <svg viewBox="0 0 3 2" aria-hidden="true"><rect width="1" height="2" fill="#0055A4"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#EF4135"/></svg>
      </button>
      <button type="button" class="flag" data-lang="en" aria-pressed="false" aria-label="English" title="English">
        <svg viewBox="0 0 60 30" aria-hidden="true"><clipPath id="uk-s"><path d="M0,0 v30 h60 v-30 z"/></clipPath><clipPath id="uk-t"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><g clip-path="url(#uk-s)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#uk-t)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></svg>
      </button>
    </div>
  </header>

  {% block main %}{% endblock %}

  <footer class="footer">
    <p data-i18n="footer.text">Corpus du domaine public (Art Institute of Chicago, Wikimedia Commons) · Propulsé par Cohere</p>
  </footer>

  <script type="application/json" id="boot">{{ boot | tojson }}</script>
  <script src="/static/common.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
